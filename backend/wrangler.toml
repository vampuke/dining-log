name = "dining-log-api"
main = "src/index.ts"
account_id = "49eee8b8033579863adb3b7cf0b1852c"
compatibility_date = "2026-10-31"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "dining.alanvampuke.top", custom_domain = true }
]

[vars]
APP_ENV = "production"
AUTH_ISSUER = "https://dining.alanvampuke.top"
AUTH_AUDIENCE = "dining-log-android"
JWT_ACTIVE_KID = "v1"
PASSWORD_ACTIVE_PEPPER = "v1"
REFRESH_RETRY_KEY_ID = "v1"
ACCESS_TTL_SECONDS = "600"
REFRESH_IDLE_SECONDS = "604800"
SESSION_MAX_AGE_SECONDS = "2592000"
REFRESH_RETRY_SECONDS = "120"
PASSWORD_ITERATIONS = "10000"
REGISTRATION_ENABLED = "true"
API_BODY_MAX_BYTES = "65536"
REVISION_MAX_BYTES = "131072"
SOFT_DELETE_RETENTION_DAYS = "30"
# Advertise only an actually published APK; replace all six values at release.
APP_VERSION_CODE = "10"
APP_VERSION_NAME = "0.8.2"
APP_DOWNLOAD_URL = "https://github.com/vampuke/dining-log/releases/download/v0.8.2/app-release.apk"
APP_APK_SHA256 = "63289103521454595c99a49829209080bbb68ebd18f18914ed94d306f9c7a6a7"
APP_RELEASE_NOTES = "修复历史卡片点按被时间切换吞掉、检查更新手动入口与失败提示、首访区折叠与统计口径等评审问题。"
APP_RELEASED_AT = "1793713299"

[[d1_databases]]
binding = "DB"
database_name = "dining-log-prod"
database_id = "90d3c1ef-5ea0-4308-a866-89a96e0411d8"
migrations_dir = "migrations"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
invocation_logs = false
