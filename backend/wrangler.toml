name = "dining-log-api"
main = "src/index.ts"
account_id = "49eee8b8033579863adb3b7cf0b1852c"
compatibility_date = "2026-10-31"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "dining.alanvampuke.top", custom_domain = true }
]

[vars]
APP_ENV = "production"
AUTH_ISSUER = "https://dining.alanvampuke.top"
AUTH_AUDIENCE = "dining-log-android"
JWT_ACTIVE_KID = "v1"
PASSWORD_ACTIVE_PEPPER = "v1"
REFRESH_RETRY_KEY_ID = "v1"
ACCESS_TTL_SECONDS = "600"
REFRESH_IDLE_SECONDS = "604800"
SESSION_MAX_AGE_SECONDS = "2592000"
REFRESH_RETRY_SECONDS = "120"
PASSWORD_ITERATIONS = "10000"
REGISTRATION_ENABLED = "true"
API_BODY_MAX_BYTES = "65536"
REVISION_MAX_BYTES = "131072"
SOFT_DELETE_RETENTION_DAYS = "30"
# Advertise only an actually published APK; replace all six values at release.
APP_VERSION_CODE = "8"
APP_VERSION_NAME = "0.8.0"
APP_DOWNLOAD_URL = "https://github.com/vampuke/dining-log/releases/download/v0.8.0/app-release.apk"
APP_APK_SHA256 = "1da994089277076ab0a112843eced8d3d71502b47ab82d50e7e39f249dcb2bf4"
APP_RELEASE_NOTES = "移除草稿；修复输入框提示与旋转丢输入；底部导航改悬浮胶囊并去掉到店 tab；支持应用内下载安装更新；允许截图（敏感页除外）。"
APP_RELEASED_AT = "1793609298"

[[d1_databases]]
binding = "DB"
database_name = "dining-log-prod"
database_id = "90d3c1ef-5ea0-4308-a866-89a96e0411d8"
migrations_dir = "migrations"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
invocation_logs = false
