<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>食记 · 账簿 / Ledger · 高保真原型</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&amp;family=Noto+Serif+SC:wght@500;600&amp;display=swap"
    />
    <style>
      :root {
        --bg: #f6f3ec;
        --surface: #fcfaf5;
        --ink: #1a1815;
        --secondary: #575047;
        --tertiary: #6d6359;
        --border: #d8d0c4;
        --accent: #b4523a;
        --on-accent: #ffffff;
        --danger: #823321;
        --accent-ink: #823321;
        --cta: #823321;
        --accent-soft: #f0e2d9;
        --border-strong: #8b8174;
        --gallery: #eae5dc;
        --sans:
          "Noto Sans SC", system-ui, "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }
      :root.dark {
        --bg: #141312;
        --surface: #1d1b19;
        --ink: #f4efe5;
        --secondary: #c4bbaf;
        --tertiary: #aaa093;
        --border: rgba(255, 255, 255, 0.18);
        --accent: #e6a28b;
        --on-accent: #141312;
        --danger: #e6a28b;
        --accent-ink: #e6a28b;
        --cta: #e6a28b;
        --accent-soft: #342720;
        --border-strong: #84786a;
        --gallery: #0e0d0c;
      }

      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: light;
      }
      html.dark {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--gallery);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      textarea,
      select {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button {
        color: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent-ink);
        outline-offset: 3px;
      }
      button {
        border: 0;
        background: none;
        padding: 0;
      }
      p,
      h1,
      h2,
      h3 {
        margin: 0;
      }
      ol,
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
      }
      legend {
        padding: 0;
      }
      textarea {
        resize: none;
      }
      button:disabled {
        cursor: default;
      }
      svg {
        display: block;
        flex-shrink: 0;
      }
      .icon {
        width: 24px;
        height: 24px;
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .secondary {
        color: var(--secondary);
      }
      .tertiary {
        color: var(--tertiary);
      }
      .caption {
        font-size: 11px;
        line-height: 1.5;
        color: var(--tertiary);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      [hidden] {
        display: none !important;
      }
      .gallery-head {
        padding: 32px 40px 24px;
        display: flex;
        gap: 24px;
        align-items: flex-end;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
      }
      .gallery-kicker {
        font-size: 11px;
        letter-spacing: 1.6px;
        margin-bottom: 6px;
        color: var(--secondary);
      }
      .gallery-title {
        font-family: var(--display);
        font-size: 34px;
        line-height: 1.3;
        font-weight: 600;
      }
      .gallery-desc {
        font-size: 13px;
        color: var(--secondary);
        margin-top: 8px;
      }
      .gallery-controls {
        display: flex;
        gap: 24px;
        align-items: center;
        flex-shrink: 0;
      }
      .direction-links {
        display: flex;
        gap: 16px;
        font-size: 12px;
        color: var(--secondary);
      }
      .direction-links a[aria-current="page"] {
        color: var(--ink);
        font-weight: 700;
        border-bottom: 1px solid var(--ink);
      }
      .theme-switch {
        display: flex;
        padding: 3px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        gap: 2px;
      }
      .theme-switch button {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 11px;
        font-size: 12px;
        border-radius: var(--radius);
      }
      .theme-switch .icon {
        width: 18px;
        height: 18px;
      }
      .theme-switch button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(5, 393px);
        gap: 28px;
        padding: 30px 40px 38px;
        width: max-content;
      }
      .artboard {
        margin: 0;
        width: 393px;
      }
      .board-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .board-label span:last-child {
        font-size: 11px;
        font-weight: 400;
        color: var(--secondary);
      }
      .phone {
        width: 393px;
        height: 852px;
        background: var(--bg);
        outline: 1px solid var(--border);
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        isolation: isolate;
      }
      .phone:focus {
        outline: 1px solid var(--border-strong);
      }
      .status {
        height: 28px;
        flex-shrink: 0;
        padding: 8px var(--edge) 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 600;
        line-height: 14px;
      }
      .status-icons {
        width: 63px;
        height: 14px;
      }
      .screen-content {
        flex: 1;
        min-height: 0;
        padding: 12px var(--edge) 0;
        overflow: hidden;
      }
      .system-nav {
        height: 20px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .system-nav:after {
        content: "";
        width: 108px;
        height: 4px;
        border-radius: 4px;
        background: var(--ink);
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 40px;
        margin-bottom: 14px;
        gap: 8px;
      }
      .toolbar-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--secondary);
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .toolbar .icon-btn:first-child {
        margin-left: -10px;
      }
      .text-btn {
        font-size: 13px;
        font-weight: 500;
        padding: 10px 0;
        color: var(--secondary);
      }
      .screen-title {
        font-family: var(--display);
        font-weight: 600;
        font-size: 30px;
        line-height: 1.35;
        letter-spacing: -0.5px;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.8px;
        color: var(--tertiary);
      }
      .home-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .add-btn {
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .search {
        display: flex;
        gap: 10px;
        align-items: center;
        height: 40px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        border-radius: var(--radius);
        padding: 0 11px;
        margin-top: 14px;
      }
      .search .icon {
        width: 20px;
        height: 20px;
        color: var(--secondary);
      }
      .search input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: none;
        background: none;
        color: var(--ink);
        font-size: 13px;
      }
      .search input::placeholder {
        color: var(--tertiary);
        opacity: 1;
      }
      .filters {
        display: flex;
        gap: 6px;
        margin-top: 12px;
      }
      .chip {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 12px;
        padding: 5px 11px;
        line-height: 18px;
        white-space: nowrap;
      }
      .chip[aria-pressed="true"] {
        color: var(--ink);
        border-color: var(--ink);
        background: var(--surface);
        font-weight: 600;
      }
      .list-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 14px;
        margin-bottom: 3px;
        font-size: 11px;
        color: var(--tertiary);
        line-height: 20px;
      }
      .list-sort {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        color: var(--secondary);
        font-size: inherit;
        line-height: inherit;
      }
      .list-sort .icon {
        width: 14px;
        height: 14px;
      }
      .restaurant-row {
        border-bottom: 1px solid var(--border);
        position: relative;
      }
      .restaurant-row:last-child {
        border-bottom: 0;
      }
      .row-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 44px;
        gap: 2px 10px;
        align-items: center;
        width: 100%;
        text-align: left;
        padding: 7px 0;
        transition: background-color 140ms ease-out;
        cursor: pointer;
      }
      .restaurant-row:hover .row-content,
      .restaurant-row:active .row-content {
        background: var(--surface);
      }
      .restaurant-name {
        font-size: 16px;
        font-weight: 600;
        line-height: 21px;
        display: block;
        color: var(--ink);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .restaurant-meta {
        font-size: 12px;
        line-height: 16px;
        color: var(--secondary);
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .restaurant-date {
        font-size: 11px;
        line-height: 15px;
        color: var(--tertiary);
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-rating {
        grid-column: 2;
        grid-row: 1 / 4;
        width: 44px;
        text-align: right;
        align-self: center;
        justify-self: end;
        color: var(--accent-ink);
        font-size: 19px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .rating-value::after {
        content: " 分";
        margin-left: 2px;
        color: var(--tertiary);
        font-family: var(--sans);
        font-size: 9px;
        font-weight: 500;
      }
      .row-rating.unrated {
        font-size: 11px;
        color: var(--tertiary);
      }
      .row-rating.unrated .rating-value::after {
        display: none;
      }
      .empty-state {
        padding: 40px 0;
        color: var(--secondary);
        font-size: 13px;
        text-align: center;
      }
      .bottom-nav {
        height: 68px;
        flex-shrink: 0;
        margin: 0 var(--edge);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-around;
      }
      .nav-item {
        width: 86px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        line-height: 16px;
        color: var(--secondary);
        position: relative;
        padding-bottom: 8px;
      }
      .nav-item.active {
        color: var(--accent);
        font-weight: 600;
      }
      .nav-item .solid {
        display: none;
      }
      .nav-item.active .outline {
        display: none;
      }
      .nav-item.active .solid {
        display: block;
      }
      .nav-item .icon {
        width: 24px;
        height: 24px;
      }
      .detail-heading {
        margin-bottom: 16px;
      }
      .detail-type {
        font-size: 12px;
        color: var(--secondary);
        margin-top: 10px;
      }
      .detail-score {
        display: flex;
        align-items: baseline;
        gap: 5px;
        line-height: 1;
        color: var(--accent-ink);
      }
      .detail-score strong {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 36px;
        line-height: 1.1;
      }
      .detail-score span {
        font-size: 11px;
        color: var(--tertiary);
      }
      .detail-overview {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .detail-overview .caption {
        margin-top: 5px;
      }
      .address {
        display: flex;
        gap: 8px;
        color: var(--secondary);
        font-size: 13px;
        line-height: 1.7;
        padding: 16px 0;
      }
      .address .icon {
        width: 20px;
        height: 20px;
        margin-top: 1px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .section-head h2 {
        font-family: var(--display);
        font-weight: 600;
        font-size: 19px;
        line-height: 1.5;
      }
      .review {
        font-size: 15px;
        line-height: 1.9;
        color: var(--ink);
      }
      .review p + p {
        margin-top: 10px;
      }
      .review-section {
        padding: 12px 0 20px;
      }
      .notes {
        padding: 12px 14px;
        background: var(--surface);
        border-left: 2px solid var(--border-strong);
        font-size: 13px;
        line-height: 1.75;
        color: var(--ink);
      }
      .notes .caption {
        margin-bottom: 5px;
      }
      .detail-links {
        margin-top: 18px;
        border-top: 1px solid var(--border);
      }
      .detail-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 49px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
        text-align: left;
      }
      .detail-link .link-end {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--secondary);
        font-size: 12px;
      }
      .detail-link .icon {
        width: 20px;
        height: 20px;
      }
      .detail-updated {
        margin-top: 12px;
      }
      .footer-action {
        padding: 12px var(--edge) 8px;
        flex-shrink: 0;
      }
      .primary-btn,
      .secondary-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 44px;
        border-radius: var(--button-radius);
        font-weight: 600;
        font-size: 14px;
      }
      .primary-btn {
        background: var(--cta);
        color: var(--on-accent);
      }
      .secondary-btn {
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--ink);
      }
      .primary-btn .icon,
      .secondary-btn .icon {
        width: 20px;
        height: 20px;
      }
      .dish-heading {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 16px;
      }
      .dish-restaurant {
        font-size: 13px;
        color: var(--secondary);
        margin-top: 7px;
      }
      .dish-tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        height: 37px;
        font-size: 11px;
        color: var(--tertiary);
      }
      .sort-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--secondary);
        font-size: 11px;
      }
      .sort-btn .icon {
        width: 17px;
        height: 17px;
      }
      .dish-row {
        display: grid;
        grid-template-columns: 24px 1fr 37px;
        column-gap: 8px;
        align-items: center;
        border-bottom: 1px solid var(--border);
        min-height: 64px;
        padding: 10px 0;
      }
      .dish-row:last-child {
        border: 0;
      }
      .dish-number {
        font-size: 11px;
        color: var(--tertiary);
        align-self: start;
        padding-top: 3px;
      }
      .dish-name {
        font-size: 16px;
        font-weight: 600;
        line-height: 24px;
      }
      .dish-comment {
        font-size: 12px;
        color: var(--secondary);
        line-height: 19px;
        margin-top: 1px;
      }
      .dish-rating {
        font-family: var(--mono);
        font-size: 23px;
        line-height: 1.2;
        text-align: right;
        color: var(--accent-ink);
      }
      .dish-rating::after,
      .diff-number::after {
        content: " 分";
        margin-left: 2px;
        color: var(--tertiary);
        font-family: var(--sans);
        font-size: 9px;
        font-weight: 500;
        vertical-align: baseline;
      }
      .dish-footnote {
        padding-top: 13px;
        font-size: 11px;
        color: var(--tertiary);
      }
      .history-heading {
        margin-bottom: 20px;
      }
      .history-restaurant {
        font-size: 13px;
        color: var(--secondary);
        margin-top: 7px;
      }
      .history-group-label {
        font-size: 11px;
        color: var(--tertiary);
        margin-bottom: 4px;
      }
      .history-row {
        display: block;
        width: 100%;
        padding: 16px 0;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .history-row-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 7px;
        gap: 8px;
      }
      .history-row-top strong {
        font-size: 14px;
        font-weight: 600;
      }
      .history-row-top .icon {
        width: 18px;
        height: 18px;
        color: var(--secondary);
      }
      .history-row-summary {
        font-size: 13px;
        color: var(--secondary);
        line-height: 1.6;
      }
      .history-row-time {
        font-size: 11px;
        color: var(--tertiary);
        margin-top: 5px;
      }
      .history-row-summary .inline-change {
        color: var(--ink);
        font-family: var(--mono);
      }
      .history-explainer {
        padding-top: 20px;
        font-size: 12px;
        line-height: 1.8;
        color: var(--secondary);
      }
      .latest-preview {
        margin-top: 24px;
        border: 1px solid var(--border);
        padding: 16px;
        background: var(--surface);
        border-radius: var(--radius);
      }
      .preview-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .preview-values {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 11px;
      }
      .preview-values del {
        color: var(--secondary);
        font-family: var(--mono);
        font-size: 28px;
        text-decoration-thickness: 1px;
      }
      .preview-values ins {
        font-family: var(--mono);
        font-size: 28px;
        text-decoration: none;
        color: var(--accent-ink);
      }
      .score-unit {
        margin-left: 2px;
        font-family: var(--sans);
        font-size: 10px;
        font-weight: 500;
        color: var(--tertiary);
      }
      .preview-values ins .score-unit {
        color: inherit;
      }
      .preview-values .icon {
        color: var(--tertiary);
        width: 20px;
        height: 20px;
      }
      .preview-link {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 12px;
        font-size: 12px;
      }
      .preview-link .icon {
        width: 17px;
        height: 17px;
      }
      .diff-context {
        font-size: 13px;
        color: var(--secondary);
        margin-top: 8px;
      }
      .diff-timestamp {
        font-size: 11px;
        color: var(--tertiary);
        margin: 8px 0 22px;
      }
      .diff-summary {
        font-size: 11px;
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        color: var(--secondary);
        margin-bottom: 20px;
      }
      .diff-field {
        margin-bottom: 24px;
      }
      .diff-field h2 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .diff-block {
        padding: 13px 14px;
        line-height: 1.8;
        font-size: 14px;
      }
      .diff-block .caption {
        margin-bottom: 4px;
        display: block;
      }
      .diff-old {
        border: 1px solid var(--border);
        background: var(--surface);
      }
      .diff-old del {
        color: var(--secondary);
        text-decoration-thickness: 1px;
      }
      .diff-new {
        background: var(--accent-soft);

    <script>
      const root = document.documentElement;
      const key = "shiji-" + document.body.dataset.direction;
      const getLocal = (k) => {
        try {
          return JSON.parse(localStorage.getItem(k));
        } catch {
          return null;
        }
      };
      const putLocal = (k, v) => {
        try {
          localStorage.setItem(k, JSON.stringify(v));
          return true;
        } catch {
          return false;
        }
      };
      function setTheme(theme) {
        root.classList.toggle("dark", theme === "dark");
        document
          .querySelectorAll("[data-theme]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.theme === theme)),
          );
        putLocal("shiji-prototype-theme", theme);
      }
      setTheme(
        getLocal("shiji-prototype-theme") ||
          (matchMedia("(prefers-color-scheme:dark)").matches
            ? "dark"
            : "light"),
      );
      document
        .querySelectorAll("[data-theme]")
        .forEach((b) =>
          b.addEventListener("click", () => setTheme(b.dataset.theme)),
        );
      function go(id) {
        const target = document.getElementById("screen-" + id);
        target.scrollIntoView({
          behavior: matchMedia("(prefers-reduced-motion:reduce)").matches
            ? "instant"
            : "smooth",
          block: "nearest",
          inline: "center",
        });
        target.focus({ preventScroll: true });
      }
      document
        .querySelectorAll("[data-go]")
        .forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));
      let toastTimer;
      function toast(id, message) {
        const phone = document.getElementById("screen-" + id);
        let t = phone.querySelector(".toast");
        if (!t) {
          t = document.createElement("div");
          t.className = "toast";
          t.setAttribute("role", "status");
          phone.append(t);
        }
        t.textContent = message;
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (t.hidden = true), 2600);
      }
      let currentFilter = "全部";
      function filterRows() {
        let count = 0;
        const q = document.getElementById("restaurant-search").value.trim();
        document.querySelectorAll(".restaurant-row").forEach((row) => {
          const show =
            (!q || row.dataset.search.includes(q)) &&
            (currentFilter === "全部" || row.dataset.kind === currentFilter);
          row.hidden = !show;
          if (show) count++;
        });
        document.getElementById("restaurant-count").textContent = count;
        document.querySelector(".empty-state").hidden = count > 0;
      }
      document
        .getElementById("restaurant-search")
        .addEventListener("input", filterRows);
      document.querySelectorAll("[data-filter]").forEach((b) =>
        b.addEventListener("click", () => {
          currentFilter =
            currentFilter === b.dataset.filter ? "全部" : b.dataset.filter;
          document
            .querySelectorAll("[data-filter]")
            .forEach((x) =>
              x.setAttribute(
                "aria-pressed",
                String(x.dataset.filter === currentFilter),
              ),
            );
          filterRows();
        }),
      );
      const diffData = {
        rating: {
          time: "2026-10-28 20:16",
          fields: [
            ["评分", "4", "5", "number"],
            [
              "评价",
              "味道不错，辣子鸡有些偏咸。下次试试少放盐。",
              "老板记得上次说过少放盐，这次咸度正好。辣子鸡和麻婆豆腐都很喜欢，会再来。",
              "text",
            ],
          ],
        },
        type: {
          time: "2026-10-25 18:42",
          fields: [["菜系", "小吃", "川菜", "text"]],
        },
        note: {
          time: "2026-10-22 21:08",
          fields: [
            [
              "笔记",
              "下次再来试试。",
              "周三人少些。辣子鸡要趁热吃，记得点米饭。",
              "text",
            ],
          ],
        },
      };
      document.querySelectorAll("[data-diff]").forEach((b) =>
        b.addEventListener("click", () => {
          const data = diffData[b.dataset.diff];
          const container = document.querySelector(".diff-fields");
          container.replaceChildren();
          data.fields.forEach(([name, oldValue, newValue, type]) => {
            const field = document.createElement("section");
            field.className = "diff-field";
            const heading = document.createElement("h2");
            heading.textContent = name;
            field.append(heading);
            [
              ["修改前", oldValue, "diff-old", "del"],
              ["修改后", newValue, "diff-new", "ins"],
            ].forEach(([label, value, cls, tag]) => {
              const block = document.createElement("div");
              block.className = "diff-block " + cls;
              const caption = document.createElement("span");
              caption.className = "caption";
              caption.textContent = label;
              const text = document.createElement(tag);
              text.textContent = value;
              if (type === "number") text.className = "diff-number";
              block.append(caption, text);
              field.append(block);
            });
            container.append(field);
          });
          document.querySelector("[data-diff-count]").textContent =
            data.fields.length + " 个字段";
          const time = document.querySelector("[data-diff-time]");
          time.textContent = data.time;
          time.dateTime = data.time.replace(" ", "T");
          document.querySelector(".history-list-pane").hidden = true;
          document.querySelector(".history-diff-pane").hidden = false;
          document
            .querySelector("[data-close-diff]")
            .focus({ preventScroll: true });
        }),
      );
      document
        .querySelector("[data-close-diff]")
        .addEventListener("click", () => {
          document.querySelector(".history-list-pane").hidden = false;
          document.querySelector(".history-diff-pane").hidden = true;
          document.querySelector("[data-diff]").focus({ preventScroll: true });
        });
      let sortByScore = true;
      document.querySelector("[data-sort]").addEventListener("click", (e) => {
        sortByScore = !sortByScore;
        const list = document.querySelector(".dish-list");
        const rows = [...list.children];
        rows.sort((a, b) =>
          sortByScore
            ? Number(b.dataset.dishScore) - Number(a.dataset.dishScore)
            : a.dataset.dishName.localeCompare(b.dataset.dishName, "zh-CN"),
        );
        rows.forEach((row, i) => {
          row.querySelector(".dish-number").textContent = String(
            i + 1,
          ).padStart(2, "0");
          list.append(row);
        });
        e.currentTarget.querySelector("span").textContent = sortByScore
          ? "按评分排序"
          : "按名称排序";
      });
      document.querySelector("[data-visits]").addEventListener("click", () => {
        document.querySelector(".visit-panel:not(.dish-editor)").hidden = false;
        document
          .querySelector("[data-close-visits]")
          .focus({ preventScroll: true });
      });
      document
        .querySelector("[data-close-visits]")
        .addEventListener("click", () => {
          document.querySelector(".visit-panel:not(.dish-editor)").hidden =
            true;
          document
            .querySelector("[data-visits]")
            .focus({ preventScroll: true });
        });
      document
        .querySelector("[data-add-dish]")
        .addEventListener("click", () => {
          document.querySelector(".dish-editor").hidden = false;
          document.getElementById("dish-name").focus({ preventScroll: true });
        });
      document
        .querySelector("[data-close-dish]")
        .addEventListener("click", () => {
          document.querySelector(".dish-editor").hidden = true;
          document
            .querySelector("[data-add-dish]")
            .focus({ preventScroll: true });
        });
      document.getElementById("dish-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const dishes = getLocal(key + "-new-dishes") || [];
        dishes.push({
          name: document.getElementById("dish-name").value.trim(),
          rating: document.getElementById("dish-score").value,
          note: document.getElementById("dish-note").value,
        });
        const saved = putLocal(key + "-new-dishes", dishes);
        document.querySelector(".dish-editor").hidden = true;
        toast(
          "dishes",
          saved ? "菜品已保存在本机" : "当前浏览器无法保存到本机",
        );
        e.target.reset();
      });
      const form = document.getElementById("restaurant-form");
      function formValue() {
        return Object.fromEntries(new FormData(form));
      }
      function selectRating(value) {
        document.getElementById("restaurant-rating").value = value;
        document
          .querySelectorAll("[data-rating]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.rating === value)),
          );
      }
      function selectType(value) {
        const cuisines = ["川菜", "粤菜", "面馆", "本帮菜"];
        const cuisine = cuisines.includes(value) ? value : "川菜";
        document.getElementById("restaurant-type").value = cuisine;
        document
          .querySelectorAll("[data-type]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.type === cuisine)),
          );
      }
      function saveDraft() {
        const ok = putLocal(key + "-draft", formValue());
        document.getElementById("draft-status").textContent = ok
          ? "草稿已保存在本机"
          : "草稿仅保留在当前页面";
        document.getElementById("save-restaurant").textContent = "保存餐厅";
      }
      const draft = getLocal(key + "-draft");
      if (draft) {
        for (const [k, v] of Object.entries(draft)) {
          if (form.elements.namedItem(k)) form.elements.namedItem(k).value = v;
        }
        selectRating(draft.rating || "");
        selectType(draft.type || "川菜");
      }
      saveDraft();
      form.addEventListener("input", saveDraft);
      document.querySelectorAll("[data-rating]").forEach((b) =>
        b.addEventListener("click", () => {
          selectRating(b.dataset.rating);
          saveDraft();
        }),
      );
      document.querySelectorAll("[data-type]").forEach((b) =>
        b.addEventListener("click", () => {
          selectType(b.dataset.type);
          saveDraft();
        }),
      );
      let isNew = false;
      document.querySelector("[data-new]").addEventListener("click", () => {
        isNew = true;
        document.getElementById("form-title").textContent = "新增餐厅";
        form.reset();
        ["name", "address", "review", "note"].forEach(
          (k) => (form.elements.namedItem(k).value = ""),
        );
        selectRating("");
        selectType("川菜");
        saveDraft();
        go("form");
        document
          .getElementById("restaurant-name")
          .focus({ preventScroll: true });
      });
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const value = formValue();
        if (!value.name.trim()) {
          document
            .getElementById("restaurant-name")
            .setCustomValidity("请填写店名");
          document.getElementById("restaurant-name").reportValidity();
          return;
        }
        document.getElementById("restaurant-name").setCustomValidity("");
        const saved = putLocal(
          key + (isNew ? "-new-restaurant" : "-restaurant"),
          value,
        );
        if (!isNew) {
          document.querySelector("[data-detail-name]").textContent = value.name;
          document.querySelector("[data-detail-score]").textContent =
            value.rating || "未评分";
          document.querySelector("[data-detail-type]").textContent = value.type;
          document.querySelector("[data-detail-address]").textContent =
            value.address || "暂未填写地址";
          document.querySelector("[data-detail-review]").textContent =
            value.review || "还没有写评价。";
          document.querySelector("[data-detail-note]").textContent =
            value.note || "还没有留下笔记。";
          const row = document.querySelector(".restaurant-row");
          row.querySelector(".restaurant-name").textContent = value.name;
          row.querySelector(".rating-value").textContent =
            value.rating || "未评分";
          row
            .querySelector(".row-rating")
            .classList.toggle("unrated", !value.rating);
          const track = row.querySelector(".rating-track span");
          if (track)
            track.style.setProperty(
              "--score-width",
              Number(value.rating || 0) * 20 + "%",
            );
          row.dataset.search =
            value.name + " " + value.type + " " + value.address;
          row.dataset.kind = value.type;
          const metadata = row.querySelector(".restaurant-meta");
          metadata.textContent =
            value.type +
            " · " +
            (value.address || "暂未填写地址") +
            " · 8 道菜";
        }
        document.getElementById("draft-status").textContent = saved
          ? "已保存到本机"
          : "当前浏览器无法保存到本机";
        document.getElementById("save-restaurant").textContent = saved
          ? "已保存"
          : "保存餐厅";
        toast("form", saved ? "餐厅已保存" : "当前浏览器无法保存到本机");
      });
      document
        .getElementById("restaurant-name")
        .addEventListener("input", (e) => e.target.setCustomValidity(""));
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const visits = document.querySelector(
            ".visit-panel:not(.dish-editor)",
          );
          const dish = document.querySelector(".dish-editor");
          if (!dish.hidden) document.querySelector("[data-close-dish]").click();
          else if (!visits.hidden)
            document.querySelector("[data-close-visits]").click();
          else if (!document.querySelector(".history-diff-pane").hidden)
            document.querySelector("[data-close-diff]").click();
        }
      });
    </script>
  </body>
</html>
