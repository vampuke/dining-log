              schema:
                type: string
                const: no-store
        '404':
          description: Not found, not owned, or parent unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '500':
          description: Unexpected SQL/internal failure, with no batch writes committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
          maxLength: 100
          description: NFKC + lowercase, split whitespace into at most 5 AND keywords; instr literal semantics,
            % and _ are ordinary characters.
          minLength: 1
      - in: query
        name: groups
        required: false
        schema:
          type: string
          default: restaurants
          pattern: ^(restaurants|visits|revisions)(,(restaurants|visits|revisions)){0,2}$
          description: Unique groups; dishes aggregate into restaurants. No independent cursors.
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
