      description: At least one editable field. Omitted fields stay unchanged; nullable null clears. Server computes
        diff; no client before values. No-op still guards version and parent, without changing business version
        or time.
    FieldDiff:
      type: object
      additionalProperties: false
      required:
      - field
      - before
      - after
      properties:
        field:
          type: string
          enum:
          - name
          - category
          - cuisine
          - address
          - rating_tenths
          - review
          - note
          - dining_date
          - meal
          - deleted_at
        before:
