openapi: 3.1.0
info:
  title: 食记 API
  version: 1.0.0
  description: 'v1 contract: owner-scoped restaurant, dish, visit, revision, account lifecycle and literal search APIs. JSON
    bodies <=64 KiB, snake_case, strict input, CAS expected_version and atomic successful idempotency. Domain text
    lengths count Unicode characters after NFC, CRLF-to-LF and outer trim; internal whitespace is preserved. P2 authentication
    contracts include password reauthentication, immediate session revocation and a 30-day account deletion retention period.'
servers:
- url: https://dining.alanvampuke.top/api/v1
security:
- AccessBearer: []
paths:
  /auth/register:
    post:
      operationId: post_auth_register
      summary: 'RegisterRequest → 201：AuthResult + recovery_codes: string[8]'
      x-auth: Public；注册限流
      responses:
        '201':
          description: '201：AuthResult + recovery_codes: string[8]'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResultWithRecoveryCodes'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      parameters:
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /auth/login:
    post:
      operationId: post_auth_login
      summary: LoginRequest → 200：AuthResult
      x-auth: Public；账号 / IP 限流
      responses:
        '200':
          description: 200：AuthResult
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      parameters:
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /auth/refresh:
    post:
      operationId: post_auth_refresh
      summary: '{refresh_token: string}；X-Refresh-Request-Id 必填 UUID → 200：AuthResult；同 key 重试返回同轮换结果'
      x-auth: Refresh；单独限流
      responses:
        '200':
          description: 200：AuthResult；同 key 重试返回同轮换结果
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      parameters:
      - $ref: '#/components/parameters/RefreshRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /auth/logout:
    post:
      operationId: post_auth_logout
      summary: '{refresh_token: string} → 204；撤销该 refresh 所属会话，已撤销 / 无效 token 也返回 204'
      x-auth: Refresh 作为撤销凭据；不要求未过期 access
      responses:
        '204':
          description: 204；撤销该 refresh 所属会话，已撤销 / 无效 token 也返回 204
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      parameters:
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /auth/logout-all:
    post:
      operationId: post_auth_logout_all
      summary: '{password: string} → 204；auth_version +1，撤销全部会话'
      x-auth: Reauth
      responses:
        '400':
          $ref: '#/components/responses/AccountError'
        '401':
          $ref: '#/components/responses/AccountError'
        '429':
          $ref: '#/components/responses/AccountError'
        '204':
          description: 204；auth_version +1，撤销全部会话
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReauth'
  /auth/password:
    post:
      operationId: post_auth_password
      summary: '{current_password: string, new_password: string, device_name: string} → 200：新 AuthResult；旧会话全部失效'
      x-auth: Reauth
      responses:
        '200':
          description: 200：新 AuthResult；旧会话全部失效
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      parameters:
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /auth/recover:
    post:
      operationId: post_auth_recover
      summary: '{username: string, recovery_code: string, new_password: string, device_name: string} → 200：新 AuthResult
        + recovery_codes: string[8]；旧码全失效'
      x-auth: Public；有效一次性恢复码与恢复限流
      responses:
        '200':
          description: '200：新 AuthResult + recovery_codes: string[8]；旧码全失效'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResultWithRecoveryCodes'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverRequest'
      parameters:
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /auth/recovery-codes:
    post:
      operationId: post_auth_recovery_codes
      summary: '{password: string} → 200：{recovery_codes: string[8]}；作废全部旧码'
      x-auth: Reauth
      responses:
        '400':
          $ref: '#/components/responses/AccountError'
        '401':
          $ref: '#/components/responses/AccountError'
        '409':
          $ref: '#/components/responses/AccountError'
        '429':
          $ref: '#/components/responses/AccountError'
        '200':
          description: '200：{recovery_codes: string[8]}；作废全部旧码'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/RecoveryCodeResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReauth'
  /auth/sessions:
    get:
      operationId: get_auth_sessions
      summary: '无 body → 200：{items: DeviceSession[]}，只列当前有效会话'
      x-auth: Access
      responses:
        '200':
          description: '200：{items: DeviceSession[]}，只列当前有效会话'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/SessionList'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/sessions/{session_id}:
    delete:
      operationId: delete_auth_sessions_session_id
      summary: 无 body → 204；只撤销自己指定的设备会话，已撤销也 204
      x-auth: Access；非本人 session 404
      responses:
        '204':
          description: 204；只撤销自己指定的设备会话，已撤销也 204
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /me:
    get:
      operationId: get_me
      summary: 无 body → 200：User
      x-auth: Access
      responses:
        '401':
          $ref: '#/components/responses/AccountError'
        '200':
          description: 200：User
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
    patch:
      operationId: patch_me
      summary: '{expected_version: integer, display_name: string}；Idempotency-Key → 200：User；用户名不允许修改'
      x-auth: Access
      responses:
        '400':
          $ref: '#/components/responses/AccountError'
        '401':
          $ref: '#/components/responses/AccountError'
        '409':
          $ref: '#/components/responses/AccountError'
        '200':
          description: 200：User；用户名不允许修改
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
    delete:
      operationId: delete_me
      summary: '{expected_version: integer, password: string, confirm_username: string} → 202：{deleted_at, purge_after}；立即失效全部会话'
      x-auth: Reauth；不进业务幂等表
      responses:
        '400':
          $ref: '#/components/responses/AccountError'
        '401':
          $ref: '#/components/responses/AccountError'
        '409':
          $ref: '#/components/responses/AccountError'
        '429':
          $ref: '#/components/responses/AccountError'
        '202':
          description: 202：{deleted_at, purge_after}；立即失效全部会话
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AccountDeleteResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDelete'
  /restaurants:
    post:
      operationId: post_restaurants
      summary: RestaurantCreate；Idempotency-Key → 201：RestaurantCreateResult；餐厅与可选 first_visit 原子创建
      x-auth: Access
      responses:
        '201':
          description: 201：RestaurantCreateResult；餐厅与可选 first_visit 原子创建
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/RestaurantCreateResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          description: Strict input/query or cursor validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          description: Access/session invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '404':
          description: Not found, not owned, or parent unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '500':
          description: Unexpected SQL/internal failure, with no batch writes committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '409':
          description: Version, idempotency fingerprint, or owned ID conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Actual JSON body exceeds 64 KiB or diff exceeds 128 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Use application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantCreate'
    get:
      operationId: get_restaurants
      summary: 下述 RestaurantQuery → 200：Page<RestaurantSummary>
      x-auth: Access
      responses:
        '200':
          description: 200：Page<RestaurantSummary>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantSummaryPage'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          description: Strict input/query or cursor validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          description: Access/session invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '404':
          description: Not found, not owned, or parent unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '500':
          description: Unexpected SQL/internal failure, with no batch writes committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          description: NFKC + lowercase, split whitespace into at most 5 AND keywords; instr literal semantics,
            % and _ are ordinary characters.
      - in: query
        name: deleted
        required: false
        schema:
          type: string
          enum:
          - exclude
          - only
          - include
          default: exclude
      - in: query
        name: cursor
        required: false
        schema:
          type: string
          maxLength: 2048
          description: Opaque signed keyset cursor; 400 INVALID_CURSOR if malformed or mismatched.
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - in: query
        name: min_rating
        required: false
        schema:
          type: number
          minimum: 1
          maximum: 5
          multipleOf: 0.1
      - in: query
        name: max_rating
        required: false
        schema:
          type: number
          minimum: 1
          maximum: 5
          multipleOf: 0.1
      - in: query
        name: unrated
        required: false
        schema:
          type: boolean
          description: true conflicts with rating bounds.
      - in: query
        name: sort
        required: false
        schema:
          type: string
          enum:
          - updated_desc
          - rating_desc
          default: updated_desc
      - in: query
        name: category
        required: false
        schema:
          $ref: '#/components/schemas/Category'
      - in: query
        name: cuisine
        required: false
        schema:
          type: string
          maxLength: 60
          description: NFKC/lowercase exact match.
      - in: query
        name: visited
        required: false
        schema:
          type: boolean
      - in: query
        name: visited_from
        required: false
        schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Valid Gregorian date, 1900-01-01 through 2100-12-31; no timezone conversion.
      - in: query
        name: visited_to
