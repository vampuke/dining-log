      responses:
        '200':
          description: 200：RevisionMetadataResult；隐藏，metadata_version +1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: revision_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataVersionBody'
  /revisions/{revision_id}/restore:
    post:
      operationId: post_revisions_revision_id_restore
      summary: RevisionRestoreBody；Idempotency-Key → 200：RevisionMetadataResult；取消隐藏
      x-auth: Access；原实体未永久清理
      responses:
        '200':
          description: 200：RevisionMetadataResult；取消隐藏
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
