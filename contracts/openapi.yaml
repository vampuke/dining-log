components:
  responses:
    AccountError:
      description: Authentication, strict input, rate limit or account version/idempotency conflict. VERSION_CONFLICT includes the six-field current User.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
      description: Required UUID v4 for all domain writes. SHA-256(method + normalized path + canonical normalized
        JSON); success response is atomic with business/history/search, cached 7 days. Same fingerprint replays
        original status/data/meta; another fingerprint is 409. Errors are not cached.
    RefreshRequestId:
      name: X-Refresh-Request-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    AuthIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: 可选 UUID v4。同账号、同 key、同 method/path/payload 在 120 秒内返回相同加密缓存结果；不同 payload 或过期 key 返回 409。鉴权响应仅存
        AES-GCM 密文；密码仅参与 HMAC 请求指纹。
  schemas:
    AppVersion:
      type: object
      additionalProperties: false
      required:
      - latest
      properties:
        latest:
          $ref: '#/components/schemas/AppRelease'
    AppRelease:
      type: object
      additionalProperties: false
      required:
      - version_code
      - version_name
      - url
      - sha256
      - notes
      - released_at
      properties:
        version_code:
          type: integer
          minimum: 1
          maximum: 2147483647
        version_name:
          type: string
          minLength: 1
          maxLength: 80
        url:
          type: string
          format: uri
          description: HTTPS download URL without credentials; opened in the system browser.
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        notes:
          type: string
          maxLength: 4000
        released_at:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: UTC Unix seconds.
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        username:
          type: string
        display_name:
          type: string
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - username
      - display_name
      - version
      - created_at
      - updated_at
      additionalProperties: false
    Rating:
      type:
      - number
      - 'null'
      minimum: 1
      maximum: 5
      multipleOf: 0.1
      description: Null means unrated. Storage and revision diffs use integer rating_tenths; responses divide by
        10.
    Category:
      type: string
      enum:
      - restaurant
      - cafe
      - bakery
      - bar
      - street_food
      - other
    Meal:
      type:
      - string
      - 'null'
      enum:
      - breakfast
      - lunch
      - dinner
      - other
      - null
    Restaurant:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - category
      - cuisine
      - address
      - rating
      - review
      - note
      - version
      - created_at
      - updated_at
      - deleted_at
      properties:
        id:
