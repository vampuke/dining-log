      x-auth: Access
      responses:
        '200':
          description: 200：Revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: revision_id
        in: path
        required: true
        schema: *id001
    patch:
      operationId: patch_revisions_revision_id
      summary: '{expected_metadata_version: integer, note: string\|null}；Idempotency-Key
        → 200：RevisionMetadataResult'
      x-auth: Access
      responses:
        '200':
          description: 200：RevisionMetadataResult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
