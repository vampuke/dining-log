              $ref: '#/components/schemas/MetadataVersionBody'
  /search:
    get:
      operationId: get_search
      summary: 'q 必填；groups=restaurants,visits,revisions，默认 restaurants；每组 limit 默认
        10、最大 20 → 200：{restaurants: RestaurantSearchResult[], visits: VisitSummary[],
        revisions: RevisionSummary[]}；菜品命中归入所属餐厅结果，不返回全局 dishes 组'
      x-auth: Access
      responses:
        '200':
          description: '200：{restaurants: RestaurantSearchResult[], visits: VisitSummary[],
            revisions: RevisionSummary[]}；菜品命中归入所属餐厅结果，不返回全局 dishes 组'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /health:
    get:
      operationId: get_health
      summary: '无 → 200：{status: "ok", api_version: "v1"}；不查询或暴露 D1 结构 / 账号'
      x-auth: Public
      responses:
        '200':
          description: '200：{status: "ok", api_version: "v1"}；不查询或暴露 D1 结构 / 账号'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id001
    RefreshRequestId:
      name: X-Refresh-Request-Id
      in: header
      required: true
      schema: *id001
  schemas:
    User:
      type: object
      properties:
        id: *id001
        username: &id002
          type: string
        display_name: *id002
        version: &id004
          type: integer
          minimum: 1
        created_at: &id003
          type: string
          format: date-time
        updated_at: *id003
    Rating:
      type:
      - number
      - 'null'
      minimum: 1
      maximum: 5
      multipleOf: 0.1
    Category:
      type: string
      enum:
      - restaurant
      - cafe
      - bakery
      - bar
      - street_food
      - other
    Meal:
      type:
      - string
      - 'null'
      enum:
      - breakfast
      - lunch
      - dinner
      - other
      - null
    Restaurant:
      type: object
      properties:
        id: *id001
        version: *id004
        created_at: *id003
        updated_at: *id003
        deleted_at: &id008
          type:
          - string
          - 'null'
          format: date-time
        name: *id002
        category: &id006
          $ref: '#/components/schemas/Category'
        address: *id002
        cuisine: &id005
          type:
          - string
          - 'null'
        rating: &id007
          $ref: '#/components/schemas/Rating'
        review: *id005
        note: *id005
    RestaurantCreate:
      type: object
      properties:
        id: *id001
        name: *id002
        category: *id006
        address: *id002
        cuisine: *id005
        rating: *id007
        review: *id005
        note: *id005
        first_visit:
          $ref: '#/components/schemas/VisitCreate'
      required:
      - id
      - name
      - category
      - address
      additionalProperties: false
    RestaurantPatch:
      type: object
      properties:
        expected_version: *id004
        name: *id002
        category: *id006
        address: *id002
        cuisine: *id005
        rating: *id007
        review: *id005
        note: *id005
      required:
      - expected_version
      additionalProperties: false
    Dish:
      type: object
      properties:
        id: *id001
        version: *id004
        created_at: *id003
        updated_at: *id003
        deleted_at: *id008
        name: *id002
        rating: &id009
          $ref: '#/components/schemas/Rating'
        review: *id005
        restaurant_id: *id001
    DishCreate:
      type: object
      properties:
        id: *id001
        name: *id002
        rating: *id009
        review: *id005
      required:
      - id
      - name
      additionalProperties: false
    DishPatch:
      type: object
      properties:
        expected_version: *id004
        name: *id002
        rating: *id009
        review: *id005
      required:
      - expected_version
      additionalProperties: false
    Visit:
      type: object
      properties:
        id: *id001
        version: *id004
        created_at: *id003
        updated_at: *id003
        deleted_at: *id008
        dining_date: &id010
          type: string
          format: date
        meal: &id011
          $ref: '#/components/schemas/Meal'
        note: *id005
        restaurant_id: *id001
    VisitCreate:
      type: object
      properties:
        id: *id001
        dining_date: *id010
        meal: *id011
        note: *id005
      required:
      - id
      - dining_date
      additionalProperties: false
    VisitPatch:
      type: object
      properties:
        expected_version: *id004
        dining_date: *id010
        meal: *id011
        note: *id005
      required:
      - expected_version
      additionalProperties: false
    FieldDiff:
      type: object
      properties:
        field: *id002
        before: {}
        after: {}
      required:
      - field
      - before
      - after
      additionalProperties: false
    Revision:
      type: object
      properties:
        id: *id001
        change_set_id: *id001
        restaurant_id: *id001
        entity_type:
          type: string
          enum:
          - restaurant
          - dish
          - visit
        entity_id: *id001
        action:
          type: string
          enum:
          - create
          - update
          - delete
          - restore
        entity_version_before:
          type: integer
          minimum: 0
        entity_version_after: *id004
        diff:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldDiff'
        source_revision_id:
          type:
          - string
          - 'null'
          format: uuid
        note: *id005
        metadata_version: *id004
        metadata_updated_at: *id003
        created_at: *id003
        deleted_at: *id005
    RevisionApply:
      type: object
      properties:
        source_revision_id: *id001
        side:
          enum:
          - before
          - after
          type: string
        fields:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: *id002
        expected_version: *id004
      required:
      - source_revision_id
      - side
      - fields
      - expected_version
      additionalProperties: false
    RevisionMetadataPatch:
      type: object
      properties:
        expected_metadata_version: *id004
        note: *id005
      required:
      - expected_metadata_version
      - note
      additionalProperties: false
    VersionBody:
      type: object
      properties:
        expected_version: *id004
      required:
      - expected_version
      additionalProperties: false
    MetadataVersionBody:
      type: object
      properties:
        expected_metadata_version: *id004
      required:
      - expected_metadata_version
      additionalProperties: false
    RegisterRequest:
      type: object
      properties:
        username: *id002
        password: *id002
        display_name: *id002
        device_name: *id002
      required:
      - username
      - password
      - device_name
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        username: *id002
        password: *id002
        device_name: *id002
      required:
      - username
      - password
      - device_name
      additionalProperties: false
    RefreshRequest:
      type: object
      properties:
        refresh_token: *id002
      required:
      - refresh_token
      additionalProperties: false
    PasswordReauth:
      type: object
      properties:
        password: *id002
      required:
      - password
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        current_password: *id002
        new_password: *id002
        device_name: *id002
      required:
      - current_password
      - new_password
      - device_name
      additionalProperties: false
    RecoverRequest:
      type: object
      properties:
        username: *id002
        recovery_code: *id002
        new_password: *id002
        device_name: *id002
      required:
      - username
      - recovery_code
      - new_password
      - device_name
      additionalProperties: false
    UserPatch:
      type: object
      properties:
        expected_version: *id004
        display_name: *id002
      required:
      - expected_version
      - display_name
      additionalProperties: false
    AccountDelete:
      type: object
      properties:
        expected_version: *id004
        password: *id002
        confirm_username: *id002
      required:
      - expected_version
      - password
      - confirm_username
      additionalProperties: false
    AuthResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token_type:
          const: Bearer
          type: string
        access_token: *id002
        expires_in:
          type: integer
          const: 600
        refresh_token: *id002
        refresh_expires_at: *id003
        session_expires_at: *id003
        session_id: *id001
    Health:
      type: object
      properties:
        status:
          const: ok
          type: string
        api_version:
          const: v1
          type: string
      required:
      - status
      - api_version
      additionalProperties: false
    Meta:
      type: object
      properties:
        request_id: *id001
        next_cursor: *id005
        has_more:
          type: boolean
    SuccessEnvelope:
      type: object
      properties:
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    PageEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items: {}
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - VALIDATION_ERROR
              - UNKNOWN_FIELD
              - INVALID_CURSOR
              - MISSING_VERSION
              - INVALID_CREDENTIALS
              - TOKEN_EXPIRED
              - SESSION_REVOKED
              - REFRESH_REUSED
              - NOT_FOUND
              - PARENT_UNAVAILABLE
              - VERSION_CONFLICT
              - IDEMPOTENCY_CONFLICT
              - USERNAME_TAKEN
              - ID_CONFLICT
              - RESTORE_WINDOW_EXPIRED
              - PAYLOAD_TOO_LARGE
              - DIFF_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - RATE_LIMITED
              - DATABASE_BUSY
              - TEMPORARILY_UNAVAILABLE
            message: *id002
            field_errors:
              type: object
            current: {}
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - error
      - meta
