  /visits/{visit_id}/revisions:
    get:
      operationId: get_visits_visit_id_revisions
      summary: 同上 → 200：Page<RevisionSummary>
      x-auth: Access；目标属于本人且未永久清理
      responses:
        '200':
          description: 200：Page<RevisionSummary>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: visit_id
        in: path
