      responses:
        '200':
          description: 200：Page<RevisionSummary>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: dish_id
        in: path
