openapi: 3.1.0
info:
  title: 食记 API
  version: 0.2.0
  description: P2 独立账号闭环；其余业务端点仍为 P1 契约骨架。认证成功/错误信封遵循 PLAN 4.1，错误码使用大写。
servers:
- url: https://dining.alanvampuke.top/api/v1
security:
- AccessBearer: []
paths:
  /auth/register:
    post:
      operationId: post_auth_register
      summary: 'RegisterRequest → 201：AuthResult + recovery_codes: string[8]'
      x-auth: Public；注册限流
      responses:
        '201':
          description: '201：AuthResult + recovery_codes: string[8]'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResultWithRecoveryCodes'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      parameters:
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /auth/login:
    post:
      operationId: post_auth_login
      summary: LoginRequest → 200：AuthResult
      x-auth: Public；账号 / IP 限流
      responses:
        '200':
          description: 200：AuthResult
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      parameters:
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /auth/refresh:
    post:
      operationId: post_auth_refresh
      summary: '{refresh_token: string}；X-Refresh-Request-Id 必填 UUID → 200：AuthResult；同
        key 重试返回同轮换结果'
      x-auth: Refresh；单独限流
      responses:
        '200':
          description: 200：AuthResult；同 key 重试返回同轮换结果
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      parameters:
      - $ref: '#/components/parameters/RefreshRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /auth/logout:
    post:
      operationId: post_auth_logout
      summary: '{refresh_token: string} → 204；撤销该 refresh 所属会话，已撤销 / 无效 token 也返回
        204'
      x-auth: Refresh 作为撤销凭据；不要求未过期 access
      responses:
        '204':
          description: 204；撤销该 refresh 所属会话，已撤销 / 无效 token 也返回 204
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      parameters:
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /auth/logout-all:
    post:
      operationId: post_auth_logout_all
      summary: '{password: string} → 204；auth_version +1，撤销全部会话'
      x-auth: Reauth
      responses:
        '204':
          description: 204；auth_version +1，撤销全部会话
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReauth'
  /auth/password:
    post:
      operationId: post_auth_password
      summary: '{current_password: string, new_password: string, device_name: string}
        → 200：新 AuthResult；旧会话全部失效'
      x-auth: Reauth
      responses:
        '200':
          description: 200：新 AuthResult；旧会话全部失效
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      parameters:
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /auth/recover:
    post:
      operationId: post_auth_recover
      summary: '{username: string, recovery_code: string, new_password: string, device_name:
        string} → 200：新 AuthResult + recovery_codes: string[8]；旧码全失效'
      x-auth: Public；有效一次性恢复码与恢复限流
      responses:
        '200':
          description: '200：新 AuthResult + recovery_codes: string[8]；旧码全失效'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResultWithRecoveryCodes'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverRequest'
      parameters:
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /auth/recovery-codes:
    post:
      operationId: post_auth_recovery_codes
      summary: '{password: string} → 200：{recovery_codes: string[8]}；作废全部旧码'
      x-auth: Reauth
      responses:
        '200':
          description: '200：{recovery_codes: string[8]}；作废全部旧码'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReauth'
  /auth/sessions:
    get:
      operationId: get_auth_sessions
      summary: '无 body → 200：{items: DeviceSession[]}，只列当前有效会话'
      x-auth: Access
      responses:
        '200':
          description: '200：{items: DeviceSession[]}，只列当前有效会话'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/SessionList'
                  meta:
                    $ref: '#/components/schemas/Meta'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/sessions/{session_id}:
    delete:
      operationId: delete_auth_sessions_session_id
      summary: 无 body → 204；只撤销自己指定的设备会话，已撤销也 204
      x-auth: Access；非本人 session 404
      responses:
        '204':
          description: 204；只撤销自己指定的设备会话，已撤销也 204
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '429':
          description: 全局限流或连续失败锁定。
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 等待秒数
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: session_id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      - $ref: '#/components/parameters/AuthIdempotencyKey'
  /me:
    get:
      operationId: get_me
      summary: 无 body → 200：User
      x-auth: Access
      responses:
        '200':
          description: 200：User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: patch_me
      summary: '{expected_version: integer, display_name: string}；Idempotency-Key
        → 200：User；用户名不允许修改'
      x-auth: Access
      responses:
        '200':
          description: 200：User；用户名不允许修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
    delete:
      operationId: delete_me
      summary: '{expected_version: integer, password: string, confirm_username: string}
        → 202：{deleted_at, purge_after}；立即失效全部会话'
      x-auth: Reauth；不进业务幂等表
      responses:
        '202':
          description: 202：{deleted_at, purge_after}；立即失效全部会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDelete'
  /restaurants:
    post:
      operationId: post_restaurants
      summary: RestaurantCreate；Idempotency-Key → 201：RestaurantCreateResult；餐厅与可选
        first_visit 原子创建
      x-auth: Access
      responses:
        '201':
          description: 201：RestaurantCreateResult；餐厅与可选 first_visit 原子创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantCreate'
    get:
      operationId: get_restaurants
      summary: 下述 RestaurantQuery → 200：Page<RestaurantSummary>
      x-auth: Access
      responses:
        '200':
          description: 200：Page<RestaurantSummary>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /restaurants/{restaurant_id}:
    get:
      operationId: get_restaurants_restaurant_id
      summary: deleted=exclude\|include，默认 exclude → 200：RestaurantDetail；include
        可查看自己的软删除对象
      x-auth: Access
      responses:
        '200':
          description: 200：RestaurantDetail；include 可查看自己的软删除对象
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: restaurant_id
        in: path
        required: true
        schema: *id001
    patch:
      operationId: patch_restaurants_restaurant_id
      summary: RestaurantPatch；Idempotency-Key → 200：MutationResult<Restaurant>
      x-auth: Access
      responses:
        '200':
          description: 200：MutationResult<Restaurant>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: restaurant_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantPatch'
    delete:
      operationId: delete_restaurants_restaurant_id
      summary: DeleteBody；Idempotency-Key → 200：MutationResult<Tombstone>
      x-auth: Access
      responses:
        '200':
          description: 200：MutationResult<Tombstone>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: restaurant_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionBody'
  /restaurants/{restaurant_id}/restore:
    post:
      operationId: post_restaurants_restaurant_id_restore
      summary: RestoreBody；Idempotency-Key → 200：MutationResult<Restaurant>；过期 410
      x-auth: Access
      responses:
        '200':
          description: 200：MutationResult<Restaurant>；过期 410
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: restaurant_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionBody'
  /restaurants/{restaurant_id}/dishes:
    post:
      operationId: post_restaurants_restaurant_id_dishes
      summary: DishCreate；Idempotency-Key → 201：MutationResult<Dish>
      x-auth: Access；父餐厅有效
      responses:
        '201':
          description: 201：MutationResult<Dish>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: restaurant_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishCreate'
    get:
      operationId: get_restaurants_restaurant_id_dishes
      summary: q、min_rating、max_rating、unrated、sort=updated_desc\|rating_desc、deleted、cursor、limit
        → 200：Page<DishSummary>
      x-auth: Access；父餐厅有效
      responses:
        '200':
          description: 200：Page<DishSummary>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: restaurant_id
        in: path
        required: true
        schema: *id001
  /dishes/{dish_id}:
    get:
      operationId: get_dishes_dish_id
      summary: deleted=exclude\|include → 200：Dish
      x-auth: Access；父餐厅有效
      responses:
        '200':
          description: 200：Dish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: dish_id
        in: path
        required: true
        schema: *id001
    patch:
      operationId: patch_dishes_dish_id
      summary: DishPatch；Idempotency-Key → 200：MutationResult<Dish>
      x-auth: Access；父餐厅有效
      responses:
        '200':
          description: 200：MutationResult<Dish>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: dish_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishPatch'
    delete:
      operationId: delete_dishes_dish_id
      summary: DeleteBody；Idempotency-Key → 200：MutationResult<Tombstone>
      x-auth: Access；父餐厅有效
      responses:
        '200':
          description: 200：MutationResult<Tombstone>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        default:
          description: PLAN.md 4.1 错误信封
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      parameters:
      - name: dish_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionBody'
  /dishes/{dish_id}/restore:
    post:
      operationId: post_dishes_dish_id_restore
      summary: RestoreBody；Idempotency-Key → 200：MutationResult<Dish>
      x-auth: Access；父餐厅先恢复，30 天内
      responses:
        '200':
          description: 200：MutationResult<Dish>
          content:
            application/json:
              schema:
