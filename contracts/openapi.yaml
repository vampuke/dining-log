            enum:
            - name
            - category
            - cuisine
            - address
            - rating_tenths
            - review
            - note
            - dining_date
            - meal
          minItems: 1
          maxItems: 7
          uniqueItems: true
        expected_version:
          $ref: '#/components/schemas/Version'
      description: Only action=update sources owned by the caller. Fields must occur in the source diff and be editable
        for the target entity type. Revalidate values and recompute current -> selected history values; retain unselected
        fields. No id/owner/version/system times/deleted_at.
    RevisionMetadataPatch:
      type: object
      additionalProperties: false
      required:
      - expected_metadata_version
      - note
      properties:
        expected_metadata_version:
          $ref: '#/components/schemas/Version'
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    VersionBody:
      type: object
      additionalProperties: false
      required:
