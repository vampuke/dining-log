          type: string
          format: date-time
    RevisionApply:
      type: object
      additionalProperties: false
      required:
      - source_revision_id
      - side
      - fields
      - expected_version
      properties:
        source_revision_id:
          $ref: '#/components/schemas/Uuid'
        side:
          type: string
          enum:
          - before
          - after
        fields:
          type: array
          items:
