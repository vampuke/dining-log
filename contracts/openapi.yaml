components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id001
    RefreshRequestId:
      name: X-Refresh-Request-Id
      in: header
      required: true
      schema: *id001
    AuthIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: 可选 UUID v4。同账号、同 key、同 method/path/payload 在 120 秒内返回相同加密缓存结果；不同
        payload 或过期 key 返回 409。鉴权响应仅存 AES-GCM 密文；密码仅参与 HMAC 请求指纹。
  schemas:
    User:
      type: object
      properties:
        id: *id001
        username: &id002
          type: string
        display_name: *id002
        version: &id004
          type: integer
          minimum: 1
        created_at: &id003
          type: string
          format: date-time
        updated_at: *id003
    Rating:
      type:
      - number
      - 'null'
      minimum: 1
      maximum: 5
      multipleOf: 0.1
    Category:
      type: string
      enum:
      - restaurant
      - cafe
      - bakery
      - bar
      - street_food
      - other
    Meal:
      type:
      - string
      - 'null'
      enum:
      - breakfast
      - lunch
      - dinner
      - other
      - null
    Restaurant:
      type: object
      properties:
        id: *id001
        version: *id004
        created_at: *id003
        updated_at: *id003
        deleted_at: &id008
          type:
          - string
          - 'null'
          format: date-time
        name: *id002
        category: &id006
          $ref: '#/components/schemas/Category'
        address: *id002
        cuisine: &id005
          type:
          - string
          - 'null'
        rating: &id007
          $ref: '#/components/schemas/Rating'
        review: *id005
        note: *id005
    RestaurantCreate:
      type: object
      properties:
        id: *id001
        name: *id002
        category: *id006
        address: *id002
        cuisine: *id005
        rating: *id007
        review: *id005
        note: *id005
        first_visit:
          $ref: '#/components/schemas/VisitCreate'
      required:
      - id
      - name
      - category
      - address
      additionalProperties: false
    RestaurantPatch:
      type: object
      properties:
        expected_version: *id004
        name: *id002
        category: *id006
        address: *id002
        cuisine: *id005
        rating: *id007
        review: *id005
        note: *id005
      required:
      - expected_version
      additionalProperties: false
    Dish:
      type: object
      properties:
        id: *id001
        version: *id004
        created_at: *id003
        updated_at: *id003
        deleted_at: *id008
        name: *id002
        rating: &id009
          $ref: '#/components/schemas/Rating'
        review: *id005
        restaurant_id: *id001
    DishCreate:
      type: object
      properties:
        id: *id001
        name: *id002
        rating: *id009
        review: *id005
      required:
      - id
      - name
      additionalProperties: false
    DishPatch:
      type: object
      properties:
        expected_version: *id004
        name: *id002
        rating: *id009
        review: *id005
      required:
      - expected_version
      additionalProperties: false
    Visit:
      type: object
      properties:
        id: *id001
        version: *id004
        created_at: *id003
        updated_at: *id003
        deleted_at: *id008
        dining_date: &id010
          type: string
          format: date
        meal: &id011
          $ref: '#/components/schemas/Meal'
        note: *id005
        restaurant_id: *id001
    VisitCreate:
      type: object
      properties:
        id: *id001
        dining_date: *id010
        meal: *id011
        note: *id005
      required:
      - id
      - dining_date
      additionalProperties: false
    VisitPatch:
      type: object
      properties:
        expected_version: *id004
        dining_date: *id010
        meal: *id011
        note: *id005
      required:
      - expected_version
      additionalProperties: false
    FieldDiff:
      type: object
      properties:
        field: *id002
        before: {}
        after: {}
      required:
      - field
      - before
      - after
      additionalProperties: false
    Revision:
      type: object
      properties:
        id: *id001
        change_set_id: *id001
        restaurant_id: *id001
        entity_type:
          type: string
          enum:
          - restaurant
          - dish
          - visit
        entity_id: *id001
        action:
          type: string
          enum:
          - create
          - update
          - delete
          - restore
        entity_version_before:
          type: integer
          minimum: 0
        entity_version_after: *id004
        diff:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldDiff'
        source_revision_id:
          type:
          - string
          - 'null'
          format: uuid
        note: *id005
        metadata_version: *id004
        metadata_updated_at: *id003
        created_at: *id003
        deleted_at: *id005
    RevisionApply:
      type: object
      properties:
        source_revision_id: *id001
        side:
          enum:
          - before
          - after
          type: string
        fields:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: *id002
        expected_version: *id004
      required:
      - source_revision_id
      - side
      - fields
      - expected_version
      additionalProperties: false
    RevisionMetadataPatch:
      type: object
      properties:
        expected_metadata_version: *id004
        note: *id005
      required:
      - expected_metadata_version
      - note
      additionalProperties: false
    VersionBody:
      type: object
      properties:
        expected_version: *id004
      required:
      - expected_version
      additionalProperties: false
    MetadataVersionBody:
      type: object
      properties:
        expected_metadata_version: *id004
      required:
      - expected_metadata_version
      additionalProperties: false
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 256
          description: NFKC → trim → lowercase 后满足 ^[a-z][a-z0-9_]{2,31}$。
        password: &id013
          type: string
          maxLength: 128
          minLength: 12
          writeOnly: true
          description: 12–128 Unicode 字符，UTF-8 ≤512 bytes；允许空格和 Unicode，拒绝全空白、NUL
            与随包 v1 弱口令表。密码不做规范化。
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        device_name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - username
      - password
      - device_name
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 256
          description: NFKC → trim → lowercase 后满足 ^[a-z][a-z0-9_]{2,31}$。
        password: &id012
          type: string
          maxLength: 512
          writeOnly: true
        device_name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - username
      - password
      - device_name
      additionalProperties: false
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          maxLength: 128
          writeOnly: true
      required:
      - refresh_token
      additionalProperties: false
    PasswordReauth:
      type: object
      properties:
        password: *id002
      required:
      - password
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        current_password: *id012
        new_password: *id013
        device_name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - current_password
      - new_password
      - device_name
      additionalProperties: false
    RecoverRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 256
          description: NFKC → trim → lowercase 后满足 ^[a-z][a-z0-9_]{2,31}$。
        recovery_code:
          type: string
          maxLength: 128
          writeOnly: true
        new_password: *id013
        device_name:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - username
      - recovery_code
      - new_password
      - device_name
      additionalProperties: false
    UserPatch:
