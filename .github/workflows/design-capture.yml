name: Design Capture
on:
  workflow_dispatch:
  push:
    branches: [capture/design-screenshots]
permissions:
  contents: read
concurrency:
  group: design-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Screenshot-only diagnostic: renders the four design-preview screens in
  # both styles and both modes, then uploads the PNGs. No backend, no lint,
  # no unit tests, no second API level.
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: false
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture design screenshots (API35)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/capture-design-screenshots.sh
      - name: Retain design screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-capture
          path: android/app/build/outputs/p4-screenshots/
          if-no-files-found: error
          retention-days: 14
