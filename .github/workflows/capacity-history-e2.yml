name: Capacity history projection E2
on:
  push:
    branches: [verify/issue19-capacity-history-payload-20261112]
  workflow_dispatch:
    inputs:
      reviewed_candidate_sha:
        description: Independently reviewed exact candidate SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: capacity-history-e2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Record attempt and validate exact route
        id: route
        continue-on-error: true
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_candidate_sha }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/capacity-history-e2"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          facts = {k: os.environ.get(k) for k in ('GITHUB_SHA','GITHUB_REF','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_EVENT_NAME')}
          Path(os.environ['RUNNER_TEMP'], 'capacity-history-e2', 'attempt.json').write_text(json.dumps(facts, indent=2)+'\n')
          assert facts['GITHUB_REF'] == 'refs/heads/verify/issue19-capacity-history-payload-20261112'
          assert facts['GITHUB_EVENT_NAME'] in ('push','workflow_dispatch')
          if facts['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              assert os.environ['REVIEWED_SHA'] == facts['GITHUB_SHA'], 'Exact independently reviewed SHA required'
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        if: steps.route.outcome == 'success'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: node
        if: steps.checkout.outcome == 'success'
        with:
          node-version: '22'
      - name: Guard candidate and frozen source before install
        id: guard
        if: steps.node.outcome == 'success'
        continue-on-error: true
        run: python3 -B .github/scripts/capacity-history-e2.py --phase guard --output "$RUNNER_TEMP/capacity-history-e2/guard"
      - name: Install unchanged backend lock once
        id: install
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set +e
          # FD 3 routes stdout to its writer; stderr has an independent writer.
          # Keep the command's real status, and check every evidence writer.
          {
            {
              npm ci 2>&1 1>&3
              code=$?
              printf '%s\n' "$code" > "$RUNNER_TEMP/capacity-history-e2/install.exit"
              receipt_code=$?
              if [ "$code" -ne 0 ]; then exit "$code"; fi
              exit "$receipt_code"
            } | tee "$RUNNER_TEMP/capacity-history-e2/install.stderr" > /dev/null
            stderr_codes=("${PIPESTATUS[@]}")
            if [ "${stderr_codes[0]}" -ne 0 ]; then exit "${stderr_codes[0]}"; fi
            exit "${stderr_codes[1]}"
          } 3>&1 | tee "$RUNNER_TEMP/capacity-history-e2/install.stdout" > /dev/null
          stdout_codes=("${PIPESTATUS[@]}")
          if [ "${stdout_codes[0]}" -ne 0 ]; then exit "${stdout_codes[0]}"; fi
          exit "${stdout_codes[1]}"
      - name: Stdlib dummy controls
        id: controls
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          E2_TEST_EVIDENCE: ${{ runner.temp }}/capacity-history-e2-controls-disposable
        shell: bash
        run: |
          # Adversarial stdlib trees stay outside the upload; the runner removes them.
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          checkout = Path(os.environ['GITHUB_WORKSPACE'])
          upload = temp / 'capacity-history-e2'
          disposable = Path(os.environ['E2_TEST_EVIDENCE'])
          for root in (temp, checkout, upload):
              assert root.is_absolute() and root.is_dir() and not root.is_symlink() and root.resolve() == root, 'canonical nonsymlink evidence boundary required'
          assert checkout == Path.cwd(), 'checkout boundary drift'
          assert not any(c in str(temp) for c in '*?[]\r\n'), 'literal RUNNER_TEMP required'
          assert disposable == temp / 'capacity-history-e2-controls-disposable' and str(disposable) == os.environ['E2_TEST_EVIDENCE'], 'fixed runner-temp fixture root required'
          assert disposable.resolve() == disposable and not disposable.exists() and not disposable.is_symlink(), 'fresh nonsymlink fixture root required'
          for root in (checkout, upload):
              assert not disposable.is_relative_to(root) and not root.is_relative_to(disposable), 'overlapping fixture evidence roots'
          controls = upload / 'controls'
          assert not controls.exists() and not controls.is_symlink(), 'fresh nonsymlink control log root required'
          disposable.mkdir(mode=0o700)
          controls.mkdir(mode=0o700)
          PY
          set +e
          # Check both log writers even if unittest succeeds or ignores I/O errors.
          {
            {
              python3 -B -m unittest discover -s .github/scripts -p test_capacity_history_e2.py -v 2>&1 1>&3
              code=$?
              printf '%s\n' "$code" > "$RUNNER_TEMP/capacity-history-e2/controls/exit"
              receipt_code=$?
              if [ "$code" -ne 0 ]; then exit "$code"; fi
              exit "$receipt_code"
            } | tee "$RUNNER_TEMP/capacity-history-e2/controls/stderr" > /dev/null
            stderr_codes=("${PIPESTATUS[@]}")
            if [ "${stderr_codes[0]}" -ne 0 ]; then exit "${stderr_codes[0]}"; fi
            exit "${stderr_codes[1]}"
          } 3>&1 | tee "$RUNNER_TEMP/capacity-history-e2/controls/stdout" > /dev/null
          stdout_codes=("${PIPESTATUS[@]}")
          if [ "${stdout_codes[0]}" -ne 0 ]; then exit "${stdout_codes[0]}"; fi
          exit "${stdout_codes[1]}"
      - name: Native preflight pair
        id: preflight
        if: steps.controls.outcome == 'success'
        continue-on-error: true
        run: python3 -B .github/scripts/capacity-history-e2.py --phase preflight --output "$RUNNER_TEMP/capacity-history-e2/preflight"
      - name: Read preflight infrastructure gate
        id: gate
        if: always()
        shell: bash
        run: |
          python3 -B - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP'], 'capacity-history-e2/preflight')
          valid = False
          try:
              spec = importlib.util.spec_from_file_location('capacity_history_e2', '.github/scripts/capacity-history-e2.py')
              e2 = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(e2)
              value = json.loads((p / 'phase.json').read_text())
              identity = {key: os.environ[env] for key, env in (
                  ('candidate', 'GITHUB_SHA'), ('ref', 'GITHUB_REF'), ('run', 'GITHUB_RUN_ID'), ('attempt', 'GITHUB_RUN_ATTEMPT'))}
              identity['runtime'] = value['runtime']
              e2.preflight_gate(p, identity)
              valid = True
          except (OSError, ValueError, KeyError, TypeError):
              pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('valid='+str(valid).lower()+'\n')
          PY
      - name: Native serial ABBA
        id: abba
        if: always() && steps.controls.outcome == 'success' && steps.gate.outputs.valid == 'true'
        continue-on-error: true
        run: python3 -B .github/scripts/capacity-history-e2.py --phase abba --preflight "$RUNNER_TEMP/capacity-history-e2/preflight" --output "$RUNNER_TEMP/capacity-history-e2/abba"
      - name: Validate workflow command evidence
        id: evidence
        if: always()
        continue-on-error: true
        env:
          UPLOAD_ROOT: ${{ runner.temp }}/capacity-history-e2
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
        shell: bash
        run: |
          python3 -B - <<'PY'
          import os, re, stat
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def directory(raw):
              path = Path(raw)
              require(path.anchor == '/' and str(path) == raw and '..' not in path.parts,
                      'absolute canonical directory required')
              # Open every component relative to its parent, never following a link.
              fd = os.open('/', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  for part in path.parts[1:]:
                      child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                      os.close(fd)
                      fd = child
                  return fd
              except BaseException:
                  os.close(fd)
                  raise

          temp = Path(os.environ['RUNNER_TEMP'])
          os.close(directory(os.environ['RUNNER_TEMP']))
          upload = Path(os.environ['UPLOAD_ROOT'])
          require(upload == temp / 'capacity-history-e2', 'exact runner-temp upload root required')
          require(upload.is_relative_to(temp) and upload != temp, 'overlapping or escaped upload root')
          upload_fd = directory(os.environ['UPLOAD_ROOT'])
          identities = set()

          def member(relative, read=False):
              path = upload / relative
              require(path.is_relative_to(upload) and '..' not in path.parts, 'escaped evidence member')
              parent = directory(str(path.parent))
              try:
                  facts = os.stat(path.name, dir_fd=parent, follow_symlinks=False)
                  require(stat.S_ISREG(facts.st_mode) and facts.st_nlink == 1, 'regular exclusive evidence member required')
                  identity = (facts.st_dev, facts.st_ino)
                  require(identity not in identities, 'overlapping evidence members')
                  identities.add(identity)
                  if not read:
                      return None
                  fd = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=parent)
                  with os.fdopen(fd, 'rb') as stream:
                      opened = os.fstat(stream.fileno())
                      require(stat.S_ISREG(opened.st_mode) and opened.st_nlink == 1 and
                              (opened.st_dev, opened.st_ino) == identity, 'evidence changed during open')
                      return stream.read()
              finally:
                  os.close(parent)

          member('attempt.json')
          for command, outcome in (('install', os.environ['INSTALL_OUTCOME']),
                                   ('controls', os.environ['CONTROLS_OUTCOME'])):
              require(outcome in ('success', 'failure', 'skipped'), 'unknown command outcome')
              names = (['install.stdout', 'install.stderr', 'install.exit'] if command == 'install'
                       else ['controls/stdout', 'controls/stderr', 'controls/exit'])
              # Only fixed command namespaces are enumerated; native phase ledgers
              # remain subject to their existing independent native gates.
              if command == 'install':
                  present = {name for name in os.listdir(upload_fd) if name.startswith('install.')}
                  expected = set(names)
              else:
                  try:
                      root_fd = os.open('controls', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
                                        dir_fd=upload_fd)
                  except FileNotFoundError:
                      present = set()
                  else:
                      try:
                          present = set(os.listdir(root_fd))
                      finally:
                          os.close(root_fd)
                  expected = {'stdout', 'stderr', 'exit'}
              if outcome == 'skipped' and not present:
                  continue
              require(present == expected, 'incomplete or unexpected command evidence members')
              for name in names[:2]:
                  member(name)
              receipt = member(names[2], read=True)
              require(re.fullmatch(rb'(0|[1-9][0-9]*)\n', receipt) is not None, 'canonical decimal exit receipt required')
              if outcome != 'skipped':
                  require((receipt == b'0\n') == (outcome == 'success'), 'command outcome/exit mismatch')
          os.close(upload_fd)
          print('Workflow command evidence complete')
          PY
      - name: Always upload attempted raw evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DIAGNOSTIC_HISTORY_PROJECTION_E2_NOT_ROOT_CAUSE-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capacity-history-e2/
          if-no-files-found: error
          retention-days: 14
      - name: Aggregate every required exit including preflight and upload
        if: always()
        env:
          OUTCOMES: ${{ steps.route.outcome }} ${{ steps.checkout.outcome }} ${{ steps.node.outcome }} ${{ steps.guard.outcome }} ${{ steps.install.outcome }} ${{ steps.controls.outcome }} ${{ steps.preflight.outcome }} ${{ steps.abba.outcome }} ${{ steps.evidence.outcome }} ${{ steps.artifact.outcome }}
        run: |
          python3 -B - <<'PY'
          import os
          outcomes = os.environ['OUTCOMES'].split()
          assert len(outcomes) == 10 and all(x == 'success' for x in outcomes), outcomes
          PY
