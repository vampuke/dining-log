name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Verify final v1 OpenAPI contract
        run: node tests/contracts.mjs
      - run: npm test
      - name: Verify SQL with sqlite3 CLI
        run: bash tests/sql/verify.sh
      - name: Measure 4500 and 6000 object capacity
        timeout-minutes: 15
        continue-on-error: false
        run: |
          set -euo pipefail
          mkdir -p tests/capacity/output
          npm run test:capacity 2>&1 | tee tests/capacity/output/capacity.log
      - name: Render measured capacity report
        if: always()
        run: node tests/capacity/report.mjs tests/capacity/output/capacity.log
      - name: Upload capacity measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-results
          path: backend/tests/capacity/output/
          if-no-files-found: error
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          key: android-sdk-35-build-tools-35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK and write dependency locks
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :core:test :data:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --write-locks --no-daemon
      - name: Verify debug APK identity and checksums
        working-directory: android/app/build/outputs/apk/debug
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app-debug.apk > APK_BADGING.txt
          cat APK_BADGING.txt
          grep -E "^package: name='top\.alanvampuke\.dininglog' " APK_BADGING.txt
          python3 "$GITHUB_WORKSPACE/android/tools/verify_apk.py" app-debug.apk > APK_MANIFEST.json
          cat APK_MANIFEST.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app-debug.apk > APK_SIGNATURE.txt
          sha256sum app-debug.apk > SHA256SUMS
          md5sum app-debug.apk > MD5SUMS
          stat -c '%n %s bytes' app-debug.apk > APK_SIZE.txt
          cat APK_SIZE.txt SHA256SUMS MD5SUMS
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/**/gradle.lockfile
            android/core/build/test-results/test/
            android/core/build/reports/tests/test/
            android/data/build/test-results/testDebugUnitTest/
            android/data/build/reports/tests/testDebugUnitTest/
            android/data/schemas/
          retention-days: 7

  android-auth-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install the local Worker test runtime
        working-directory: backend
        run: npm ci
      - name: Start isolated local API and D1 for Android E2E
        run: bash .github/scripts/start-android-api.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keystore, authentication and product Compose tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/android-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-auth-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/p4-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-log-${{ matrix.api }}
          path: /tmp/android-worker.log
          if-no-files-found: error
          retention-days: 14
