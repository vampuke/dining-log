name: ci
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Verify production release selection guards without production credentials
        run: |
          set -euo pipefail
          node --test ../.github/scripts/release-guards.test.mjs
          python3 -B -m unittest discover -s ../.github/scripts -p 'test_*.py'
      - run: npm run check
      - name: Verify final v1 OpenAPI contract
        run: node tests/contracts.mjs
      - run: npm test
      - run: npm run db:verify
      - name: Validate and bundle the Worker without production credentials
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --dry-run --outdir build/worker
          git rev-parse HEAD > build/worker/SOURCE_COMMIT
          cd build/worker
          sha256sum index.js > SHA256SUMS
      - name: Retain the reviewed bootstrap Worker bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-candidate
          path: backend/build/worker/
          if-no-files-found: error
          retention-days: 14
      - name: Verify independent smoke against an isolated Actions Worker and D1
        env:
          DINING_SMOKE_BASE_URL: http://127.0.0.1:8787/api/v1
        run: |
          set -euo pipefail
          (cd "$GITHUB_WORKSPACE" && bash .github/scripts/start-android-api.sh)
          npm run smoke:production
      - name: Verify SQL with sqlite3 CLI
        run: bash tests/sql/verify.sh
      - name: Measure 4500 and 6000 object capacity
        timeout-minutes: 15
        continue-on-error: false
        run: |
          set -euo pipefail
          mkdir -p tests/capacity/output
          npm run test:capacity 2>&1 | tee tests/capacity/output/capacity.log
      - name: Render measured capacity report
        if: always()
        run: node tests/capacity/report.mjs tests/capacity/output/capacity.log
      - name: Upload capacity measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capacity-results
          path: backend/tests/capacity/output/
          if-no-files-found: error
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          key: android-sdk-35-build-tools-35.0.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build, lint and test using committed dependency locks
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :core:test :data:testDebugUnitTest :feature:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Assert release refuses each missing signing variable
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          export DINING_SIGNING_STORE_FILE="$RUNNER_TEMP/non-secret-signing-test.jks"
          export DINING_SIGNING_STORE_PASSWORD=non-secret-test-placeholder
          export DINING_SIGNING_KEY_ALIAS=dining-log
          export DINING_SIGNING_KEY_PASSWORD=non-secret-test-placeholder
          trap 'rm -f "$DINING_SIGNING_STORE_FILE"' EXIT
          touch "$DINING_SIGNING_STORE_FILE"
          for missing in DINING_SIGNING_STORE_FILE DINING_SIGNING_STORE_PASSWORD DINING_SIGNING_KEY_ALIAS DINING_SIGNING_KEY_PASSWORD; do
            log="$RUNNER_TEMP/missing-$missing.txt"
            if env -u "$missing" ./gradlew :app:assembleRelease --no-daemon > "$log" 2>&1; then
              echo "Release unexpectedly succeeded without $missing"
              exit 1
            fi
            grep -F "Release signing requires environment variables: $missing" "$log"
          done
      - name: Verify debug APK identity and checksums
        working-directory: android/app/build/outputs/apk/debug
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app-debug.apk > APK_BADGING.txt
          cat APK_BADGING.txt
          grep -E "^package: name='top\.alanvampuke\.dininglog\.debug' " APK_BADGING.txt
          python3 "$GITHUB_WORKSPACE/android/tools/verify_apk.py" app-debug.apk --expected-package top.alanvampuke.dininglog.debug > APK_MANIFEST.json
          cat APK_MANIFEST.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app-debug.apk > APK_SIGNATURE.txt
          sha256sum app-debug.apk > SHA256SUMS
          md5sum app-debug.apk > MD5SUMS
          stat -c '%n %s bytes' app-debug.apk > APK_SIZE.txt
          cat APK_SIZE.txt SHA256SUMS MD5SUMS
      - name: Upload verified debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/**/gradle.lockfile
            android/core/build/test-results/test/
            android/core/build/reports/tests/test/
            android/data/build/test-results/testDebugUnitTest/
            android/data/build/reports/tests/testDebugUnitTest/
            android/feature/build/test-results/testDebugUnitTest/
            android/feature/build/reports/tests/testDebugUnitTest/
            android/data/schemas/
          retention-days: 7

  android-auth-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install the local Worker test runtime
        working-directory: backend
        run: npm ci
      - name: Start isolated local API and D1 for Android E2E
        run: bash .github/scripts/start-android-api.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Keystore, authentication and product Compose tests (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/android-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-auth-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/p4-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-api-log-${{ matrix.api }}
          path: /tmp/android-worker.log
          if-no-files-found: error
          retention-days: 14
