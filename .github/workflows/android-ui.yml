name: android-ui
on:
  workflow_dispatch:
    inputs:
      refresh_dependency_locks:
        description: Regenerate and verify Android dependency locks on Actions
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  dependency-locks:
    if: inputs.refresh_dependency_locks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Resolve build and instrumentation dependency graphs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :core:test :data:testDebugUnitTest :feature:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --write-locks --no-daemon
      - name: Verify the generated locks without rewriting them
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :core:test :data:testDebugUnitTest :feature:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --no-daemon --rerun-tasks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-dependency-locks
          path: android/**/gradle.lockfile
          if-no-files-found: error
          retention-days: 14
  product-suite:
    if: ${{ !inputs.refresh_dependency_locks }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: bash .github/scripts/start-android-api.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/android-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-ui-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/p4-screenshots/
            /tmp/android-worker.log
          if-no-files-found: error
          retention-days: 14
